[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrcode-mcp"
version = "0.1.1"
description = "MCP server for QR decoding (including damaged-code repair), generation, URL routing and pluggable OCR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "qrmcp contributors" }]
keywords = [
    "mcp", "model-context-protocol", "mcp-server", "qrcode", "qr-code",
    "qr-decoder", "qr-code-generator", "qr-code-scanner", "ocr",
    "computer-vision", "reed-solomon", "error-correction", "image-processing",
    "zxing", "segno", "winrt", "rapidocr", "json-rpc", "claude-desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Typing :: Typed",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.5",
    "zxing-cpp>=2.0",
    "segno>=1.5",
    "reedsolo>=1.7",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.8", "pyzbar>=0.1.9"]
ocr-windows = [
    "winrt-runtime>=3.0",
    "winrt-Windows.Media.Ocr>=3.0",
    "winrt-Windows.Graphics.Imaging>=3.0",
    "winrt-Windows.Storage>=3.0",
    "winrt-Windows.Storage.Streams>=3.0",
    "winrt-Windows.Globalization>=3.0",
    "winrt-Windows.Foundation.Collections>=3.0",
]
ocr-rapid = ["rapidocr_onnxruntime>=1.3"]
ocr-tesseract = ["pytesseract>=0.3.10"]
ocr = [
    "winrt-runtime>=3.0",
    "winrt-Windows.Media.Ocr>=3.0",
    "winrt-Windows.Graphics.Imaging>=3.0",
    "winrt-Windows.Storage>=3.0",
    "winrt-Windows.Storage.Streams>=3.0",
    "winrt-Windows.Globalization>=3.0",
    "winrt-Windows.Foundation.Collections>=3.0",
    "rapidocr_onnxruntime>=1.3",
    "pytesseract>=0.3.10",
]
full = [
    "opencv-python>=4.8",
    "pyzbar>=0.1.9",
    "winrt-runtime>=3.0",
    "winrt-Windows.Media.Ocr>=3.0",
    "winrt-Windows.Graphics.Imaging>=3.0",
    "winrt-Windows.Storage>=3.0",
    "winrt-Windows.Storage.Streams>=3.0",
    "winrt-Windows.Globalization>=3.0",
    "winrt-Windows.Foundation.Collections>=3.0",
    "rapidocr_onnxruntime>=1.3",
    "pytesseract>=0.3.10",
]
dev = ["pytest>=7", "build>=1.0", "twine>=4.0"]

[project.urls]
Homepage = "https://github.com/xiaobinger/qrcode-mcp"
Repository = "https://github.com/xiaobinger/qrcode-mcp"
Issues = "https://github.com/xiaobinger/qrcode-mcp/issues"
Documentation = "https://github.com/xiaobinger/qrcode-mcp#readme"

[project.scripts]
qrmcp = "qrmcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qrmcp*"]

[tool.setuptools.package-data]
qrmcp = ["py.typed"]
